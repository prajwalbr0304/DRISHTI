# DRISHTI CI/CD — Catalyst Pipelines (Phase 14 Part B + Part I scoping / matrix
# row 26, workflow §1). Catalyst Pipelines owns CI/CD only; data/event workflows
# live in Functions/AppSail/Signals/Jobs.
#
# Part I — the sufficient hackathon pipeline (this file):
#   install dependencies -> lint/test -> build frontend + API -> scan for secrets
#   -> deploy to Catalyst development -> health/auth/prediction smoke tests
#   -> retain the previous deploy for rollback.
#
# Deferred (documented, intentionally NOT in this pipeline):
#   - full SBOM + licence automation;
#   - production artifact-promotion gates (approve -> promote to prod);
#   - GPU image rebuilding inside the pipeline — the GPU worker is deployed
#     SEPARATELY with AWS CLI/SageMaker scripts (see infra/aws/gpu-worker/) and
#     referenced by immutable image/model versions;
#   - automated Data Store export + forward-recovery simulation;
#   - deployment concurrency locks (parallel deploys are not expected here);
#   - deliberately-failed-deployment recovery testing.
#
# Deploy status: SCAFFOLDED. Runner/image config-ids + registry auth are bound in
# the Console (Pipelines -> link this repo); the credit-spending deploy stages run
# on a Catalyst runner (which has Docker, so it also unblocks the AppSail image
# build the local machine cannot do). << ... >> tokens are pipeline expressions.

version: 1

jobs:
  # --- 1-2. install dependencies + lint/test ------------------------------
  lint:
    steps:
      - npm --prefix web ci                       # install web deps
      - npm --prefix web run lint
      - npm --prefix web run typecheck
  test:
    steps:
      - npm --prefix web ci
      - npm --prefix web run test
      - pip install -r services/ml/requirements.appsail.txt pytest   # install API deps
      # Light API/contract tests only; the real GPU/foundation run is external.
      - pytest services/ml/tests -q -k "not gpu and not cuda"
      # Fail closed on PG->Data Store mapping drift + regenerate import configs.
      - python infra/catalyst/ds-import/generate_import_configs.py

  # --- 3. build frontend and API -----------------------------------------
  build_frontend:
    variables:
      VITE_DEMO_BADGE: Synthetic Hackathon Demo
    steps:
      - npm --prefix web ci
      - npm --prefix web run build
      # Recreate the Slate SPA config wiped by the clean build.
      - mkdir -p web/dist/.catalyst
      - cp infra/catalyst/client/slate-config.toml web/dist/.catalyst/slate-config.toml
    artifacts:
      upload:
        - name: drishti-web-dist
          type: zip
          location: stratus://drishti-cicd/artifacts/web
          files:
            - 'web/dist/**/*'
  build_api_image:
    steps:
      # Catalyst runners provide Docker, so this unblocks the linux/amd64 OCI build.
      # (This is the AppSail API image only — NOT the GPU worker, which is built +
      # pushed separately via infra/aws/gpu-worker/ by immutable digest.)
      - >-
        docker buildx build --platform linux/amd64
        -f services/ml/Dockerfile.appsail
        -t drishti-api:appsail --load services/ml
      - docker save drishti-api:appsail -o drishti-api-appsail.tar
    artifacts:
      upload:
        - name: drishti-api-appsail
          type: tar
          location: stratus://drishti-cicd/artifacts/appsail
          files:
            - 'drishti-api-appsail.tar'

  # --- 4. scan for secrets ------------------------------------------------
  secret_scan:
    steps:
      # The kept scan: fail the build on a committed secret (tool on the runner).
      - echo "secret scan (gitleaks/trufflehog) — configured on the runner image"
      # Light, non-blocking dependency audit (full SBOM/licence automation deferred).
      - npm --prefix web audit --omit=dev || true
      - pip install pip-audit && pip-audit -r services/ml/requirements.appsail.txt || true

  # --- 5. deploy to Catalyst development ----------------------------------
  deploy_dev:
    steps:
      - catalyst deploy --only functions,client
      - >-
        catalyst deploy appsail --name drishti-api
        --source docker-archive://drishti-api-appsail.tar --port 9000
      - catalyst deploy slate -m "ci: dev"
    artifacts:
      download:
        - name: drishti-api-appsail
          type: tar
          location: stratus://drishti-cicd/artifacts/appsail

  # --- 6. health/auth/prediction smoke tests ------------------------------
  smoke_dev:
    steps:
      - python infra/catalyst/pipelines/smoke_test.py --base-url << variables.DEV_APPSAIL_URL >>

  # --- 7. retain previous deploy for rollback -----------------------------
  rollback_dev:
    # Runs only if the dev deploy failed: the previous deployment is retained, so
    # roll back to the last good one. (Deliberately-failed-deploy recovery testing
    # + forward-recovery simulation are deferred.)
    when:
      - not:
          - << status.deploy.deploy_dev >>
    steps:
      - echo "deploy failed — rolling back AppSail/Slate to the retained last-good deploy"
      - catalyst deploy appsail --name drishti-api --rollback || true

stages:
  - name: validate            # install deps + lint/test
    jobs:
      - - lint
        - test
  - name: build               # frontend + API image
    jobs:
      - - build_frontend
        - build_api_image
  - name: scan                # scan for secrets
    jobs:
      - secret_scan
  - name: deploy_dev          # deploy to Catalyst development (+ retain-for-rollback)
    jobs:
      - deploy_dev
      - rollback_dev
  - name: smoke               # health/auth/prediction smoke tests
    jobs:
      - smoke_dev
