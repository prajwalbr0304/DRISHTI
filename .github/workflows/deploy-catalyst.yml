name: Frontend CI + deploy (Zoho Catalyst)

# On every push to main that touches web/, this:
#   1. ALWAYS builds + validates the web client (tsc + vite + secret-scan) — a fast
#      gate that catches a broken build before it reaches Catalyst.
#   2. OPTIONALLY deploys to a Slate app, when you opt in by setting:
#        - repo VARIABLE  SLATE_APP_NAME  = the CLI-registered Slate app name
#        - repo SECRET    CATALYST_TOKEN  = catalyst token:generate --current
#
# Why "optional": the live demo app (drishti-uryfmaue) is a *Git-integrated* Slate
# app, which the CLI cannot target (`deploy slate <name>` = "not found in config")
# and `catalyst pull`/create are interactive. The classic Web Client Hosting
# (`deploy --only client`) fails for this app with ZIPSANITIZER_FILES_COUNT_EXCEEDED
# because the landing animation ships hundreds of frames (Slate handles it, the
# classic client does not). So the recommended "push -> auto-deploy" for the live
# app is the Slate Git integration's Auto-Deploy toggle (Console). This workflow
# still guarantees a validated build on every push, and can deploy to a separate
# CLI-managed Slate app if you set the two values above.
# See docs/deployment/GITHUB_ACTIONS_DEPLOY.md.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-catalyst.yml"
  workflow_dispatch: {}

concurrency:
  group: catalyst-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build web client (+ optional Slate deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Production build (VITE_API_BASE_URL from web/.env.production).
      # check-bundle-secrets fails the build if a secret/DB/AWS URL leaks in.
      - name: Build + validate web client
        working-directory: web
        run: npm run build

      - name: Install Catalyst CLI
        if: ${{ vars.SLATE_APP_NAME != '' }}
        run: npm install -g zcatalyst-cli@1.27.0

      - name: Deploy to Slate (opt-in)
        if: ${{ vars.SLATE_APP_NAME != '' }}
        working-directory: web/dist
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "::error::SLATE_APP_NAME is set but the CATALYST_TOKEN secret is missing. Run 'catalyst token:generate --current' and add it as an Actions secret."
            exit 1
          fi
          catalyst deploy slate "${{ vars.SLATE_APP_NAME }}" --no-wait \
            -m "CI ${GITHUB_SHA}" --token "$CATALYST_TOKEN"
