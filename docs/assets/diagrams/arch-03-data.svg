<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="700" viewBox="0 0 1840 700" role="img" aria-label="DRISHTI data architecture"><title>DRISHTI data architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/></marker><marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B6CFB"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8C"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="1840" height="700" fill="#FFFFFF"/><text x="28" y="34" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="start">Data architecture — one ontology, two serving planes</text><text x="28" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#4B5563" font-weight="400" text-anchor="start">Synthetic sources are validated into a canonical ontology, then split: a curated operational plane on Catalyst and a protected analytical plane on AWS.</text><line x1="28" y1="66" x2="1812" y2="66" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/><rect x="28" y="92" width="440" height="96" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 94 L31 186" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="112" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">Synthetic source datasets</text><text x="39" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">FIR, parties, evidence, property, transactions, stations, hazards. Deterministic:</text><text x="39" y="144" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">seed 42, 2021-01-01 → 2025-12-31, 41 generator modules</text><line x1="472" y1="140" x2="494" y2="140" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="498" y="92" width="440" height="96" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M501 94 L501 186" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="509" y="112" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">Validation and data quality</text><text x="509" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">Schema, referential and jurisdiction rules. Failures are staged as reviewable</text><text x="509" y="144" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">DataQualityIssues, never silently repaired</text><line x1="942" y1="140" x2="964" y2="140" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="968" y="92" width="440" height="96" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M971 94 L971 186" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="979" y="112" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">Canonical ontology + relationships</text><text x="979" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">Typed objects: case, person, party role, station, evidence, transaction, property,</text><text x="979" y="144" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">statement, lifecycle event — direction and source preserved</text><line x1="1438" y1="140" x2="1460" y2="140" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1468" y="92" width="344" height="96" rx="6" ry="6" fill="#EEF2FF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1471 94 L1471 186" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="1479" y="112" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">Immutable feature snapshots</text><text x="1479" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">Every prediction binds to a snapshot id, source cutoff and feature</text><text x="1479" y="144" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">schema version, so a forecast is reproducible</text><rect x="28" y="216" width="880" height="250" rx="10" ry="10" fill="none" stroke="#0E9F8C" stroke-width="1.3" stroke-dasharray="5 4"/><text x="40" y="233" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#0E9F8C" font-weight="700" text-anchor="start" letter-spacing="0.9">CURATED OPERATIONAL PLANE — ZOHO CATALYST</text><rect x="46" y="246" width="410" height="92" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M49 248 L49 336" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="57" y="265" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Curated serving-subset exporter</text><text x="57" y="283.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">Golden seed cases first, then deterministic fill; children FK-scoped to the</text><text x="57" y="295.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">seed; sensitive columns dropped; content SHA-256 per table</text><rect x="476" y="246" width="414" height="92" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M479 248 L479 336" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="487" y="265" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Catalyst Data Store</text><text x="487" y="283.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">106 idempotent import configs, upsert on ExternalID, dev cap 5,000 rows/table ·</text><text x="487" y="295.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">20 Data-Store-native tables for Board and Hazard</text><rect x="46" y="352" width="844" height="96" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M49 354 L49 446" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="57" y="371" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Reconciliation</text><text x="57" y="389.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">Count, content-hash and mapping-version parity plus referential resolution are checked against the Data Store; the import-config generator fails closed on mapping</text><text x="57" y="401.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">drift in CI.</text><rect x="932" y="216" width="880" height="250" rx="10" ry="10" fill="none" stroke="#B45309" stroke-width="1.3" stroke-dasharray="5 4"/><text x="944" y="233" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#B45309" font-weight="700" text-anchor="start" letter-spacing="0.9">PROTECTED ANALYTICAL PLANE — AWS</text><rect x="950" y="246" width="410" height="92" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M953 248 L953 336" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="961" y="265" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">PostgreSQL 17.10 + PostGIS + pgvector</text><text x="961" y="283.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">140 tables · 3,011,145 exact rows · 1.02 GB · 503 indexes · 20 views + 3</text><text x="961" y="295.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">materialized views · 7 extensions</text><rect x="1380" y="246" width="414" height="92" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1383 248 L1383 336" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="1391" y="265" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Private object + model storage</text><text x="1391" y="283.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">S3 with KMS for evidence objects and model artifacts; immutable ECR tags; async</text><text x="1391" y="295.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">I/O prefixes expire after 7 days</text><rect x="950" y="352" width="844" height="96" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M953 354 L953 446" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="961" y="371" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Reachable only server-to-server</text><text x="961" y="389.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">The signed adapter is the sole path. Only ids, versions, hashes and feature vectors cross the boundary — never narrative text, PII or a connection string. RDS is not</text><text x="961" y="401.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">publicly reachable in the target posture.</text><line x1="468" y1="466" x2="468" y2="496" stroke="#0E9F8C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowT)"/><line x1="1372" y1="466" x2="1372" y2="496" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowA)"/><rect x="28" y="502" width="880" height="84" rx="6" ry="6" fill="#EFF6FF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 504 L31 584" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="522" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">FastAPI domain services</text><text x="39" y="541" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">37 registered routers · 391 endpoints · every AI endpoint returns the same contract: answer, confidence 0–1, source_record_ids[], reasoning_summary (never</text><text x="39" y="554" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">chain-of-thought), model_version</text><rect x="932" y="502" width="880" height="84" rx="6" ry="6" fill="#EFF6FF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M935 504 L935 584" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="943" y="522" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">Role-scoped React application</text><text x="943" y="541" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">39 declared routes · 18 destinations across 2 workspaces · surface chosen by role, data chosen by seat scope; the server re-derives access on every request</text><line x1="908" y1="544" x2="928" y2="544" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="28" y="600" width="1784" height="62" rx="6" ry="6" fill="#EEF2FF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 602 L31 660" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="619.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="700" text-anchor="start">Audit, snapshots, model provenance and evidence trail</text><text x="39" y="638.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">Append-only. Audit rows are written transactionally with the action, so a rolled-back action rolls back its audit; passwords, narratives, date of birth, phone, Aadhaar and coordinates are stripped before storage.</text><text x="28" y="686" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">Row counts measured 26 Jul 2026 by exact COUNT(*) over every ordinary user table. All data are synthetic.</text></svg>