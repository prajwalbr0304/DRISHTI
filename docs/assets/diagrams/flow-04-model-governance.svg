<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="700" viewBox="0 0 1840 700" role="img" aria-label="DRISHTI model governance lifecycle"><title>DRISHTI model governance lifecycle</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/></marker><marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B6CFB"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8C"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="1840" height="700" fill="#FFFFFF"/><text x="28" y="34" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="start">Model governance lifecycle — why a forecast is evidence</text><text x="28" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#4B5563" font-weight="400" text-anchor="start">No model reaches an operational surface without a backtest, a registered version, a recorded human disposition and a monitoring loop back to the start.</text><line x1="28" y1="66" x2="1812" y2="66" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/><rect x="28" y="92" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 94 L31 198" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="111" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">1. Validated synthetic data</text><text x="39" y="129.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">quality and jurisdiction rules passed</text><line x1="456" y1="146" x2="478" y2="146" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="484" y="92" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M487 94 L487 198" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="495" y="111" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">2. Immutable feature snapshot</text><text x="495" y="129.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">id, source cutoff, feature schema version</text><line x1="912" y1="146" x2="934" y2="146" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="940" y="92" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M943 94 L943 198" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="951" y="111" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">3. Train / configure candidate</text><text x="951" y="129.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">TabFM · TimesFM · ST-GNN · near-repeat · KDE</text><line x1="1368" y1="146" x2="1390" y2="146" stroke="#4338CA" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1396" y="92" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1399 94 L1399 198" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="1407" y="111" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">4. Temporal + geographic backtest</text><text x="1407" y="129.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">leakage-safe rolling origin; 6 origins × 32 districts</text><rect x="28" y="224" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 226 L31 330" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="243" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">5. Model review and approval</text><text x="39" y="261.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">a named human, not an automatic promotion</text><line x1="456" y1="278" x2="478" y2="278" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="484" y="224" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M487 226 L487 330" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="495" y="243" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">6. Versioned model registry</text><text x="495" y="261.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">ModelVersion, benchmarks, training snapshot</text><line x1="912" y1="278" x2="934" y2="278" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="940" y="224" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M943 226 L943 330" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="951" y="243" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">7. Scoped inference</text><text x="951" y="261.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">jurisdiction and purpose applied before the model runs</text><line x1="1368" y1="278" x2="1390" y2="278" stroke="#0E9F8C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1396" y="224" width="424" height="108" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1399 226 L1399 330" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="1407" y="243" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">8. Confidence, drivers, provenance</text><text x="1407" y="261.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">surfaced in the UI beside the number</text><path d="M1608 200 L1608 212 L16 212 L16 278 L24 278" fill="none" stroke="#4338CA" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="28" y="356" width="880" height="76" rx="6" ry="6" fill="#EEF2FF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 358 L31 430" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="375.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="700" text-anchor="start">9. Human accept / modify / reject</text><text x="39" y="394.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">Mandatory. The disposition is recorded against the prediction id, so &#x27;who acted on this and why&#x27; is answerable months later. No model output becomes a coercive action.</text><rect x="932" y="356" width="880" height="76" rx="6" ry="6" fill="#EEF2FF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M935 358 L935 430" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="943" y="375.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="700" text-anchor="start">10. Drift, feedback and performance monitoring</text><text x="943" y="394.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">Accepted, modified and rejected outcomes feed back into the next backtest. A layer that degrades is excluded from fusion, and the exclusion reason is recorded.</text><line x1="912" y1="394" x2="928" y2="394" stroke="#4338CA" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><path d="M1372 432 L1372 452 L470 452 L470 440" fill="none" stroke="#4338CA" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arrowP)"/><text x="880" y="468" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4338CA" font-weight="400" text-anchor="middle" font-style="italic">monitoring reopens the backtest — the loop never closes permanently</text><text x="28" y="508" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">The two rules that make this more than a diagram</text><rect x="28" y="522" width="880" height="82" rx="6" ry="6" fill="#FFFBEB" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 524 L31 602" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="541" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Fails closed, never degrades silently</text><text x="39" y="559.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">A requested TabFM job that cannot run on CUDA with a verified weight digest returns CUDA_UNAVAILABLE. A CPU statistical model can never be returned labelled as a foundation</text><text x="39" y="571.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">model. Every result carries actual_backend, actual_device and model_artifact_digest, HMAC-signed so AppSail can verify it.</text><rect x="932" y="522" width="880" height="82" rx="6" ry="6" fill="#FFFBEB" stroke="#D1D5DB" stroke-width="1.2"/><path d="M935 524 L935 602" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="943" y="541" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Refuses to promote a weaker model</text><text x="943" y="559.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">The current in-context fallback scores 0.4141 accuracy against a 0.6484 prior-period baseline on an identical time-based split, so the registry does NOT mark it active. Fusion</text><text x="943" y="571.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">also refuses any layer whose output lacks the current analytics-policy attestation.</text><rect x="28" y="616" width="1784" height="62" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 618 L31 676" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="635" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Every governed prediction carries a reproducible envelope</text><text x="39" y="653" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">prediction_id · model_id · model_version · feature_snapshot_id · jurisdiction · as_of · horizon · confidence · explanation · source_hash · review_status (pending | accepted | modified | rejected)</text></svg>