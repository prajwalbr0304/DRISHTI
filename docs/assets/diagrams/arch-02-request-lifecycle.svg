<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="596" viewBox="0 0 1840 596" role="img" aria-label="DRISHTI request lifecycle and trust boundaries"><title>DRISHTI request lifecycle and trust boundaries</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/></marker><marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B6CFB"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8C"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="1840" height="596" fill="#FFFFFF"/><text x="28" y="34" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="start">Request lifecycle — how one API call is authorised</text><text x="28" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#4B5563" font-weight="400" text-anchor="start">Ten steps from browser click to rendered answer. Identity is derived server-side at step 5 and verified again at step 6.</text><line x1="28" y1="66" x2="1812" y2="66" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/><rect x="900" y="42" width="12" height="16" rx="3" ry="3" fill="#0B6CFB" stroke="none" stroke-width="0"/><text x="920" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#0B6CFB" font-weight="600" text-anchor="start">Browser</text><rect x="1136" y="42" width="12" height="16" rx="3" ry="3" fill="#4338CA" stroke="none" stroke-width="0"/><text x="1156" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4338CA" font-weight="600" text-anchor="start">Catalyst edge</text><rect x="1372" y="42" width="12" height="16" rx="3" ry="3" fill="#0E9F8C" stroke="none" stroke-width="0"/><text x="1392" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#0E9F8C" font-weight="600" text-anchor="start">AppSail domain service</text><rect x="1608" y="42" width="12" height="16" rx="3" ry="3" fill="#B45309" stroke="none" stroke-width="0"/><text x="1628" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#B45309" font-weight="600" text-anchor="start">Governed data</text><rect x="28" y="100" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 102 L31 250" stroke="#0B6CFB" stroke-width="3.6" stroke-linecap="round"/><circle cx="58 " cy="126" r="13" fill="#0B6CFB"/><text x="58" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="80" y="125.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Open the Slate app</text><text x="44" y="172.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">The React SPA loads with public configuration</text><text x="44" y="184.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">only — no credential, endpoint secret or role is</text><text x="44" y="197.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">present in the bundle.</text><line x1="372" y1="176" x2="386" y2="176" stroke="#0B6CFB" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="390" y="100" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M393 102 L393 250" stroke="#0B6CFB" stroke-width="3.6" stroke-linecap="round"/><circle cx="420 " cy="126" r="13" fill="#0B6CFB"/><text x="420" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="442" y="125.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Catalyst Authentication</text><text x="406" y="172.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">The session establishes who the user is. The</text><text x="406" y="184.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">client never asserts a role; it has nothing to</text><text x="406" y="197.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">assert it with.</text><line x1="734" y1="176" x2="748" y2="176" stroke="#0B6CFB" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="752" y="100" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M755 102 L755 250" stroke="#0B6CFB" stroke-width="3.6" stroke-linecap="round"/><circle cx="782 " cy="126" r="13" fill="#0B6CFB"/><text x="782" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="804" y="125.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">SPA calls /api/*</text><text x="768" y="172.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">The Catalyst API Gateway origin is the only</text><text x="768" y="184.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">public API path. Nothing in the browser</text><text x="768" y="197.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">addresses AppSail or AWS.</text><line x1="1096" y1="176" x2="1110" y2="176" stroke="#0B6CFB" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="1114" y="100" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1117 102 L1117 250" stroke="#4338CA" stroke-width="3.6" stroke-linecap="round"/><circle cx="1144 " cy="126" r="13" fill="#4338CA"/><text x="1144" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="1166" y="125.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">API Gateway invokes</text><text x="1166" y="139.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">gateway_api</text><text x="1130" y="172.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">Sliding-window throttle: 600 requests/min</text><text x="1130" y="184.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">overall, 120/min per IP. AppSail is not a native</text><text x="1130" y="197.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">gateway target, so the function fronts it.</text><line x1="1458" y1="176" x2="1472" y2="176" stroke="#4338CA" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="1476" y="100" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1479 102 L1479 250" stroke="#4338CA" stroke-width="3.6" stroke-linecap="round"/><circle cx="1506 " cy="126" r="13" fill="#4338CA"/><text x="1506" y="131" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="1528" y="125.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Gateway derives and signs</text><text x="1528" y="139.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">identity</text><text x="1492" y="172.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">Strips 9 spoofable identity headers, resolves</text><text x="1492" y="184.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">role and scope from the directory server-side,</text><text x="1492" y="197.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">mints a 60-second HMAC-SHA256 context.</text><rect x="28" y="282" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 284 L31 432" stroke="#0E9F8C" stroke-width="3.6" stroke-linecap="round"/><circle cx="58 " cy="308" r="13" fill="#0E9F8C"/><text x="58" y="313" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><text x="80" y="307.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">AppSail verifies the</text><text x="80" y="321.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">context</text><text x="44" y="354.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">Signature, audience, scope, expiry and nonce</text><text x="44" y="366.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">replay are all checked before routing. Any</text><text x="44" y="379.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">failure returns an opaque 401.</text><line x1="372" y1="358" x2="386" y2="358" stroke="#0E9F8C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="390" y="282" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M393 284 L393 432" stroke="#0E9F8C" stroke-width="3.6" stroke-linecap="round"/><circle cx="420 " cy="308" r="13" fill="#0E9F8C"/><text x="420" y="313" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><text x="442" y="307.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Domain policy applied</text><text x="406" y="354.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">Role, jurisdiction, purpose, rate and payload</text><text x="406" y="366.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">guards run. Aggregate-only seats are refused</text><text x="406" y="379.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">case-level detail here.</text><line x1="734" y1="358" x2="748" y2="358" stroke="#0E9F8C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="752" y="282" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M755 284 L755 432" stroke="#B45309" stroke-width="3.6" stroke-linecap="round"/><circle cx="782 " cy="308" r="13" fill="#B45309"/><text x="782" y="313" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text><text x="804" y="307.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Scoped read served</text><text x="768" y="354.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">From the curated Catalyst operational layer and,</text><text x="768" y="366.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">where authorised, the protected analytical plane</text><text x="768" y="379.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">behind the signed adapter.</text><line x1="1096" y1="358" x2="1110" y2="358" stroke="#B45309" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1114" y="282" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1117 284 L1117 432" stroke="#B45309" stroke-width="3.6" stroke-linecap="round"/><circle cx="1144 " cy="308" r="13" fill="#B45309"/><text x="1144" y="313" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">9</text><text x="1166" y="307.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Provenance written</text><text x="1130" y="354.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">Material writes and model outputs append audit</text><text x="1130" y="366.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">or model-provenance evidence, transactionally</text><text x="1130" y="379.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">with the action itself.</text><line x1="1458" y1="358" x2="1472" y2="358" stroke="#B45309" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1476" y="282" width="340" height="152" rx="8" ry="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1479 284 L1479 432" stroke="#0B6CFB" stroke-width="3.6" stroke-linecap="round"/><circle cx="1506 " cy="308" r="13" fill="#0B6CFB"/><text x="1506" y="313" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">10</text><text x="1528" y="307.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">UI renders with context</text><text x="1492" y="354.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">Scope, data freshness, confidence and source</text><text x="1492" y="366.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">indicators are shown beside the answer — never a</text><text x="1492" y="379.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">bare number.</text><path d="M1638 252 L1638 268 L198 268 L198 280" fill="none" stroke="#4338CA" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowP)"/><text x="28" y="490" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">What cannot happen</text><rect x="28" y="500" width="436" height="62" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><text x="42" y="524" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#B45309" font-weight="700" text-anchor="start">✕</text><text x="62" y="522.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">The browser cannot forge a role — only the gateway holds</text><text x="62" y="534.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">the signing secret.</text><rect x="480" y="500" width="436" height="62" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><text x="494" y="524" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#B45309" font-weight="700" text-anchor="start">✕</text><text x="514" y="522.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">A direct unauthenticated call to the AppSail URL is</text><text x="514" y="534.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">rejected 401 (non-health routes).</text><rect x="932" y="500" width="436" height="62" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><text x="946" y="524" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#B45309" font-weight="700" text-anchor="start">✕</text><text x="966" y="522.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">A 401 never reveals which check failed, so it cannot be</text><text x="966" y="534.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">used as an oracle.</text><rect x="1384" y="500" width="436" height="62" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><text x="1398" y="524" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#B45309" font-weight="700" text-anchor="start">✕</text><text x="1418" y="522.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">A nonce is consumed exactly once; replay is caught</text><text x="1418" y="534.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">in-process and in Catalyst Cache.</text><text x="28" y="582" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">The gateway is the only holder of the signing secret, which is why role forgery is structurally impossible rather than merely validated. Verified live 6 Sep 2026.</text></svg>