<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="760" viewBox="0 0 1840 760" role="img" aria-label="DRISHTI end-to-end operational process"><title>DRISHTI end-to-end operational process</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/></marker><marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B6CFB"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8C"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="1840" height="760" fill="#FFFFFF"/><text x="28" y="34" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="start">End-to-end operational process</text><text x="28" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#4B5563" font-weight="400" text-anchor="start">Five question paths converge on ONE human-review gate, and all three decision outcomes are recorded — including rejection.</text><line x1="28" y1="66" x2="1812" y2="66" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/><rect x="28" y="90" width="342" height="92" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 92 L31 180" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="108.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Complaint · FIR · import · live event</text><text x="39" y="126.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Guided 7-step intake, scanned-FIR OCR that only PRE-FILLS a draft,</text><text x="39" y="139.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">template imports, CCTV and hazard feeds</text><line x1="374" y1="136" x2="386" y2="136" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="390" y="90" width="342" height="92" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M393 92 L393 180" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="401" y="108.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Validate schema, quality and jurisdiction</text><text x="401" y="126.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Failures become reviewable DataQualityIssues; nothing is silently</text><text x="401" y="139.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">repaired</text><line x1="736" y1="136" x2="748" y2="136" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="752" y="90" width="342" height="92" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M755 92 L755 180" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="763" y="108.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Create or update governed objects</text><text x="763" y="126.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Typed case, party role, evidence, property, transaction, statement,</text><text x="763" y="139.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">lifecycle event</text><line x1="1098" y1="136" x2="1110" y2="136" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="1114" y="90" width="342" height="92" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1117 92 L1117 180" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="1125" y="108.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Resolve people, places, devices, accounts</text><text x="1125" y="126.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Entity-resolution candidates are PROPOSALS — nothing is ever</text><text x="1125" y="139.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">auto-merged</text><line x1="1460" y1="136" x2="1472" y2="136" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="1476" y="90" width="342" height="92" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1479 92 L1479 180" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="1487" y="108.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Build verified relationships + snapshots</text><text x="1487" y="126.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Immutable feature snapshot binds every later prediction to its inputs</text><polygon points="920,197.0 1050.0,226 920,255.0 790.0,226" fill="#FFFFFF" stroke="#0B6CFB" stroke-width="1.5"/><text x="920" y="224" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">Operational</text><text x="920" y="238" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">question</text><line x1="920" y1="186" x2="920" y2="198" stroke="#0B6CFB" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="28" y="306" width="342" height="82" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 308 L31 386" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="324.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">Case file and lifecycle</text><text x="39" y="342.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">18 governed sub-pages</text><rect x="28" y="286" width="122" height="20" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#0B6CFB" stroke-width="1"/><text x="89.0" y="299.168" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="8.8" fill="#0B6CFB" font-weight="600" text-anchor="middle">Case</text><path d="M920 256 L920 274 L199 274 L199 300" fill="none" stroke="#0B6CFB" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="390" y="306" width="342" height="82" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M393 308 L393 386" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="401" y="324.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">Network analysis · Investigation Board</text><text x="401" y="342.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">communities, hidden links, money trail, paths</text><rect x="390" y="286" width="122" height="20" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#4338CA" stroke-width="1"/><text x="451.0" y="299.168" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="8.8" fill="#4338CA" font-weight="600" text-anchor="middle">Relationship</text><path d="M920 256 L920 274 L561 274 L561 300" fill="none" stroke="#4338CA" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="752" y="306" width="342" height="82" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M755 308 L755 386" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="763" y="324.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">Map, hotspots and patrol planning</text><text x="763" y="342.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">5 modes · 19 deck.gl layers</text><rect x="752" y="286" width="122" height="20" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#0E9F8C" stroke-width="1"/><text x="813.0" y="299.168" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="8.8" fill="#0E9F8C" font-weight="600" text-anchor="middle">Location</text><path d="M920 256 L920 274 L923 274 L923 300" fill="none" stroke="#0E9F8C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1114" y="306" width="342" height="82" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1117 308 L1117 386" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="1125" y="324.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">Analytics, forecast and backtest</text><text x="1125" y="342.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">5 inspectable model layers</text><rect x="1114" y="286" width="122" height="20" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="1175.0" y="299.168" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="8.8" fill="#B45309" font-weight="600" text-anchor="middle">Trend</text><path d="M920 256 L920 274 L1285 274 L1285 300" fill="none" stroke="#B45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1476" y="306" width="342" height="82" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1479 308 L1479 386" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="1487" y="324.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">Ask DRISHTI scoped planner</text><text x="1487" y="342.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">read-only guarded SQL with citations</text><rect x="1476" y="286" width="122" height="20" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#0B6CFB" stroke-width="1"/><text x="1537.0" y="299.168" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="8.8" fill="#0B6CFB" font-weight="600" text-anchor="middle">Natural language</text><path d="M920 256 L920 274 L1647 274 L1647 300" fill="none" stroke="#0B6CFB" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="28" y="424" width="1784" height="62" rx="6" ry="6" fill="#EEF2FF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 426 L31 484" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="444" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700" text-anchor="start">Human review</text><text x="39" y="463" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">Every path lands here. The reviewer sees the evidence, the model version, the confidence, the time window and the provenance — never a bare score. Aggregate-only seats never see case-level rows.</text><line x1="199" y1="392" x2="199" y2="420" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="561" y1="392" x2="561" y2="420" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="923" y1="392" x2="923" y2="420" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1285" y1="392" x2="1285" y2="420" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1647" y1="392" x2="1647" y2="420" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><polygon points="920,501.0 1040.0,528 920,555.0 800.0,528" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/><text x="920" y="526" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">Officer decision</text><line x1="920" y1="490" x2="920" y2="500" stroke="#4338CA" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowP)"/><rect x="240" y="592" width="440" height="66" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M243 594 L243 656" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="251" y="610.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Approve or act</text><text x="251" y="628.5999999999999" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Controlled operational action — a person authorises it, not a model</text><path d="M920 556 L920 574 L460 574 L460 588" fill="none" stroke="#0E9F8C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowT)"/><rect x="720" y="592" width="440" height="66" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M723 594 L723 656" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="731" y="610.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Modify</text><text x="731" y="628.5999999999999" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Record the rationale and the revised plan</text><path d="M920 556 L920 574 L940 574 L940 588" fill="none" stroke="#B45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowA)"/><rect x="1200" y="592" width="440" height="66" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1203 594 L1203 656" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="1211" y="610.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.8" fill="#111827" font-weight="700" text-anchor="start">Reject</text><text x="1211" y="628.5999999999999" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="400" text-anchor="start">Record the rejection and the feedback, which feeds model monitoring</text><path d="M920 556 L920 574 L1420 574 L1420 588" fill="none" stroke="#B45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowA)"/><rect x="28" y="676" width="1784" height="54" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 678 L31 728" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="695.5" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="700" text-anchor="start">Append-only audit and evidence trail</text><text x="39" y="714.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">Audit rows are written transactionally with the action, so a rolled-back action rolls back its audit. Sensitive fields are stripped before storage. Nothing in this chain auto-dispatches, auto-accuses or closes a case.</text><line x1="460" y1="662" x2="460" y2="672" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="940" y1="662" x2="940" y2="672" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1420" y1="662" x2="1420" y2="672" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/></svg>