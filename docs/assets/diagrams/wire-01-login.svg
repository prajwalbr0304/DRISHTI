<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="540" viewBox="0 0 1300 540" role="img" aria-label="Wireframe — role-scoped sign-in"><title>Wireframe — role-scoped sign-in</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/></marker><marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B6CFB"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8C"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="1300" height="540" fill="#FFFFFF"/><rect x="10" y="10" width="1280" height="500" rx="8" ry="8" fill="#FFFFFF" stroke="#111827" stroke-width="1.6"/><text x="22" y="34" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#111827" font-weight="700" text-anchor="start">Wireframe · Role-scoped sign-in</text><text x="12" y="528" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">Role selects the SURFACE. Seat scope selects the DATA. They are orthogonal axes — that is why ADGP and DIG share one role.</text><line x1="650" y1="46" x2="650" y2="494" stroke="#D1D5DB" stroke-width="1.4" stroke-linecap="round"/><rect x="36" y="62" width="590" height="34" rx="5" ry="5" fill="#111827" stroke="#111827" stroke-width="1.2"/><text x="50" y="84" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">DRISHTI</text><text x="132" y="84" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#D1D5DB" font-weight="400" text-anchor="start">Decision Intelligence for Public Safety</text><text x="36" y="128" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#0B6CFB" font-weight="700" text-anchor="start" letter-spacing="1.1">ONE OPERATIONAL PICTURE</text><text x="36" y="156" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start">From first signal to reviewed</text><text x="36" y="176" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start">action.</text><text x="36" y="200" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start">Crime records, people, property, digital and financial</text><text x="36" y="214" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start">evidence, geography, live events and forecasts in one governed</text><text x="36" y="228" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#4B5563" font-weight="400" text-anchor="start">interface.</text><rect x="36" y="262" width="286" height="74" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M39 264 L39 334" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="47" y="281" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Crime Intelligence</text><text x="47" y="299.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#4B5563" font-weight="400" text-anchor="start">FIRs, people, networks, hotspots, forecasting</text><rect x="340" y="262" width="286" height="74" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M343 264 L343 334" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="351" y="281" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start">Emergency Response</text><text x="351" y="299.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#4B5563" font-weight="400" text-anchor="start">Multi-hazard forecasting, readiness, evacuation</text><rect x="36" y="356" width="138" height="24" rx="12.0" ry="12.0" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="105.0" y="371.78" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#4B5563" font-weight="600" text-anchor="middle">Evidence-backed</text><rect x="186" y="356" width="138" height="24" rx="12.0" ry="12.0" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="255.0" y="371.78" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#4B5563" font-weight="600" text-anchor="middle">Human-controlled</text><rect x="336" y="356" width="138" height="24" rx="12.0" ry="12.0" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="405.0" y="371.78" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#4B5563" font-weight="600" text-anchor="middle">Fully auditable</text><rect x="486" y="356" width="138" height="24" rx="12.0" ry="12.0" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="555.0" y="371.78" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#4B5563" font-weight="600" text-anchor="middle">Synthetic demo data</text><rect x="36" y="398" width="590" height="78" rx="6" ry="6" fill="#EFF6FF" stroke="#0B6CFB" stroke-width="1.2"/><text x="50" y="422" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#0B6CFB" font-weight="700" text-anchor="start">Deployed on Zoho Catalyst</text><text x="50" y="442.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">Catalyst Authentication establishes identity. The API Gateway is the only</text><text x="50" y="454.8" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.8" fill="#4B5563" font-weight="400" text-anchor="start">public API origin. The browser holds no database credential.</text><text x="676" y="84" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#111827" font-weight="700" text-anchor="start">Choose your operational seat</text><rect x="676" y="100" width="590" height="30" rx="15" ry="15" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><text x="692" y="120" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">⌕  Search 11,800 seats by name, rank, district or station</text><rect x="676" y="146" width="288" height="74" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M679 148 L679 218" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="690" y="166" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">DGP / State Command</text><text x="690" y="182" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">DGP Vikram Shetty</text><text x="690" y="198" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#0B6CFB" font-weight="600" text-anchor="start">State · all districts</text><text x="690" y="212" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">Aggregate only</text><rect x="976" y="146" width="288" height="74" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M979 148 L979 218" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="990" y="166" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">Senior Command</text><text x="990" y="182" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">IGP Meenakshi Rao</text><text x="990" y="198" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#0B6CFB" font-weight="600" text-anchor="start">Wing (state-wide) or Range</text><text x="990" y="212" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">ADGP wing / DIG range</text><rect x="676" y="230" width="288" height="74" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M679 232 L679 302" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="690" y="250" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">District Command</text><text x="690" y="266" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">SP Anand Kumar</text><text x="690" y="282" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#0B6CFB" font-weight="600" text-anchor="start">District or Commissionerate</text><text x="690" y="296" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">All stations</text><rect x="976" y="230" width="288" height="74" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M979 232 L979 302" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="990" y="250" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">SHO</text><text x="990" y="266" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">SHO Suresh Patil</text><text x="990" y="282" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#0B6CFB" font-weight="600" text-anchor="start">Station · all station cases</text><text x="990" y="296" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">Registration + review</text><rect x="676" y="314" width="288" height="74" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M679 316 L679 386" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="690" y="334" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">Investigating Officer</text><text x="690" y="350" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">PSI Ramesh Gowda</text><text x="690" y="366" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#0B6CFB" font-weight="600" text-anchor="start">Assigned cases</text><text x="690" y="380" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">Own station</text><rect x="976" y="314" width="288" height="74" rx="6" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><path d="M979 316 L979 386" stroke="#0B6CFB" stroke-width="3.4" stroke-linecap="round"/><text x="990" y="334" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start">System Admin</text><text x="990" y="350" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#4B5563" font-weight="400" text-anchor="start">Sysadmin Nikhil Jain</text><text x="990" y="366" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#0B6CFB" font-weight="600" text-anchor="start">Platform administration</text><text x="990" y="380" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#4B5563" font-weight="400" text-anchor="start" font-style="italic">Seats, roles, registry</text><rect x="676" y="402" width="590" height="74" rx="6" ry="6" fill="#F3F4F6" stroke="#B45309" stroke-width="1.2"/><text x="690" y="424" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#B45309" font-weight="700" text-anchor="start">Six application roles, nine scope types</text><text x="690" y="442.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">A role answers one question — which surface to render. Scope is resolved</text><text x="690" y="454.6" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">server-side from the seat&#x27;s posting. An unposted seat resolves to &#x27;unresolved&#x27;</text><text x="690" y="467.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.6" fill="#4B5563" font-weight="400" text-anchor="start">and sees nothing, never state-wide.</text></svg>