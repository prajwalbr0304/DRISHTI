<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="762" viewBox="0 0 1840 762" role="img" aria-label="Send to Board — governed expansion sequence"><title>Send to Board — governed expansion sequence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/></marker><marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B6CFB"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8C"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="1840" height="762" fill="#FFFFFF"/><text x="28" y="34" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="19" fill="#111827" font-weight="700" text-anchor="start">“Send to Board” — governed case-network expansion</text><text x="28" y="55" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#4B5563" font-weight="400" text-anchor="start">A concrete, verifiable governance story: for case 100239 this returns 14 nodes and 13 verified links, and appends its own audit events.</text><line x1="28" y1="66" x2="1812" y2="66" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/><rect x="24" y="84" width="192" height="40" rx="6" ry="6" fill="#F3F4F6" stroke="#0B6CFB" stroke-width="1.2"/><text x="120" y="100.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.8" fill="#111827" font-weight="700" text-anchor="middle">Officer</text><line x1="120" y1="126" x2="120" y2="640" stroke="#D1D5DB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="284" y="84" width="192" height="40" rx="6" ry="6" fill="#F3F4F6" stroke="#0B6CFB" stroke-width="1.2"/><text x="380" y="100.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.8" fill="#111827" font-weight="700" text-anchor="middle">Case File (UI)</text><line x1="380" y1="126" x2="380" y2="640" stroke="#D1D5DB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="544" y="84" width="192" height="40" rx="6" ry="6" fill="#F3F4F6" stroke="#0E9F8C" stroke-width="1.2"/><text x="640" y="100.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.8" fill="#111827" font-weight="700" text-anchor="middle">Board service (AppSail)</text><line x1="640" y1="126" x2="640" y2="640" stroke="#D1D5DB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="804" y="84" width="192" height="40" rx="6" ry="6" fill="#F3F4F6" stroke="#B45309" stroke-width="1.2"/><text x="900" y="100.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.8" fill="#111827" font-weight="700" text-anchor="middle">Governed data stores</text><line x1="900" y1="126" x2="900" y2="640" stroke="#D1D5DB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="1064" y="84" width="192" height="40" rx="6" ry="6" fill="#F3F4F6" stroke="#4338CA" stroke-width="1.2"/><text x="1160" y="100.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.8" fill="#111827" font-weight="700" text-anchor="middle">Investigation Board</text><line x1="1160" y1="126" x2="1160" y2="640" stroke="#D1D5DB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="1324" y="84" width="192" height="40" rx="6" ry="6" fill="#F3F4F6" stroke="#4338CA" stroke-width="1.2"/><text x="1420" y="100.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="10.8" fill="#111827" font-weight="700" text-anchor="middle">Evidence trail</text><line x1="1420" y1="126" x2="1420" y2="640" stroke="#D1D5DB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="128" y1="160" x2="372" y2="160" stroke="#0B6CFB" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowP)"/><text x="250.0" y="151.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#0B6CFB" font-weight="600" text-anchor="middle">Open case 100239</text><line x1="128" y1="200" x2="372" y2="200" stroke="#0B6CFB" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowP)"/><text x="250.0" y="191.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#0B6CFB" font-weight="600" text-anchor="middle">Select “Send to Board”</text><line x1="388" y1="240" x2="632" y2="240" stroke="#0B6CFB" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowP)"/><text x="510.0" y="231.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#0B6CFB" font-weight="600" text-anchor="middle">Request governed case-network expansion</text><line x1="648" y1="280" x2="892" y2="280" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowA)"/><text x="770.0" y="271.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#B45309" font-weight="600" text-anchor="middle">Load case, parties, evidence, property, legal, lifecycle</text><line x1="892" y1="320" x2="648" y2="320" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrowA)"/><text x="770.0" y="311.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="600" text-anchor="middle">Typed objects + verified relationships + source versions</text><line x1="632" y1="360" x2="388" y2="360" stroke="#0E9F8C" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrowT)"/><text x="510.0" y="351.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="600" text-anchor="middle">Preview: 14 nodes, 13 verified links</text><line x1="128" y1="400" x2="372" y2="400" stroke="#0B6CFB" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowP)"/><text x="250.0" y="391.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#0B6CFB" font-weight="600" text-anchor="middle">Confirm — create board and pin</text><line x1="388" y1="440" x2="632" y2="440" stroke="#0B6CFB" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowP)"/><text x="510.0" y="431.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#0B6CFB" font-weight="600" text-anchor="middle">Persist objects, links and pinned snapshots</text><line x1="648" y1="480" x2="1412" y2="480" stroke="#4338CA" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowP)"/><text x="1030.0" y="471.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4338CA" font-weight="600" text-anchor="middle">Append board-creation and pin events</text><line x1="648" y1="520" x2="1152" y2="520" stroke="#0E9F8C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowT)"/><text x="900.0" y="511.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#0E9F8C" font-weight="600" text-anchor="middle">Board id + hydrated graph</text><line x1="1152" y1="560" x2="128" y2="560" stroke="#4338CA" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrowP)"/><text x="640.0" y="551.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.4" fill="#4B5563" font-weight="600" text-anchor="middle">Interactive canvas, inspector, provenance</text><rect x="28" y="676" width="580" height="58" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M31 678 L31 732" stroke="#0E9F8C" stroke-width="3.4" stroke-linecap="round"/><text x="39" y="694" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#111827" font-weight="700" text-anchor="start">Live reference, not a copy</text><text x="39" y="711.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.2" fill="#4B5563" font-weight="400" text-anchor="start">Every pinned object stays linked to its source of truth, so the board can never drift into a private, unverifiable</text><text x="39" y="723.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.2" fill="#4B5563" font-weight="400" text-anchor="start">version of the case.</text><rect x="628" y="676" width="580" height="58" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M631 678 L631 732" stroke="#4338CA" stroke-width="3.4" stroke-linecap="round"/><text x="639" y="694" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#111827" font-weight="700" text-anchor="start">Pinned snapshot, not a screenshot</text><text x="639" y="711.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.2" fill="#4B5563" font-weight="400" text-anchor="start">The snapshot preserves what the investigator saw, with its version id — so a later change to the record is visible as a</text><text x="639" y="723.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.2" fill="#4B5563" font-weight="400" text-anchor="start">diff.</text><rect x="1228" y="676" width="584" height="58" rx="6" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/><path d="M1231 678 L1231 732" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/><text x="1239" y="694" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#111827" font-weight="700" text-anchor="start">Evidence separated from hypothesis</text><text x="1239" y="711.0" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.2" fill="#4B5563" font-weight="400" text-anchor="start">Verified links render solid; hypothesis links render dashed and are filterable. A graph relationship never establishes</text><text x="1239" y="723.2" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif" font-size="9.2" fill="#4B5563" font-weight="400" text-anchor="start">guilt.</text></svg>