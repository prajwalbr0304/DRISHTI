<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DRISHTI TimesFM trajectory layer backtest comparison</title>
  <desc id="desc">Leakage-safe rolling-origin backtest comparing the TimesFM-compatible serving model with moving average and seasonal naive baselines on MAE, RMSE and WAPE.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset=".55" stop-color="#19113a"/>
      <stop offset="1" stop-color="#27103b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="naive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1055" cy="80" r="190" fill="#8b5cf6" opacity=".1"/>
  <circle cx="80" cy="690" r="230" fill="#06b6d4" opacity=".07"/>

  <text x="58" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">TimesFM trajectory layer—rolling-origin comparison</text>
  <text x="58" y="89" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Lower error is better • 192 held-out district-months • six walk-forward origins • synthetic data</text>

  <!-- KPI cards -->
  <g filter="url(#shadow)">
    <rect x="58" y="119" width="248" height="92" rx="19" fill="#141d38" stroke="#334155"/>
    <text x="82" y="148" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">MAE SKILL VS SEASONAL NAIVE</text>
    <text x="82" y="184" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800">+17.81%</text>

    <rect x="320" y="119" width="248" height="92" rx="19" fill="#141d38" stroke="#334155"/>
    <text x="344" y="148" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">MAE SKILL VS MA(3)</text>
    <text x="344" y="184" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800">+7.13%</text>

    <rect x="582" y="119" width="248" height="92" rx="19" fill="#141d38" stroke="#334155"/>
    <text x="606" y="148" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">HELD-OUT POINTS</text>
    <text x="606" y="184" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800">192</text>

    <rect x="844" y="119" width="298" height="92" rx="19" fill="#222044" stroke="#a78bfa" stroke-opacity=".7"/>
    <text x="868" y="148" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">REAL TIMESFM 2.5 LAYER</text>
    <text x="868" y="178" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">32 districts · 92-day horizon</text>
    <text x="868" y="198" fill="#a5b4fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">registered forecast inventory</text>
  </g>

  <rect x="58" y="238" width="1084" height="391" rx="24" fill="#10172d" stroke="#334155" filter="url(#shadow)"/>

  <!-- legend -->
  <rect x="640" y="257" width="145" height="30" rx="15" fill="#172554"/>
  <circle cx="658" cy="272" r="6" fill="#22d3ee"/>
  <text x="672" y="277" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Serving contract</text>
  <rect x="795" y="257" width="129" height="30" rx="15" fill="#064e3b"/>
  <circle cx="813" cy="272" r="6" fill="#34d399"/>
  <text x="827" y="277" fill="#d1fae5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Moving avg 3</text>
  <rect x="934" y="257" width="175" height="30" rx="15" fill="#4c0519"/>
  <circle cx="952" cy="272" r="6" fill="#fb7185"/>
  <text x="966" y="277" fill="#ffe4e6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Seasonal naive</text>

  <!-- MAE -->
  <text x="88" y="325" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">MAE</text>
  <text x="88" y="345" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">mean absolute error</text>
  <rect x="250" y="307" width="507" height="18" rx="9" fill="url(#primary)"/>
  <text x="767" y="321" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">6.327</text>
  <rect x="250" y="332" width="545" height="14" rx="7" fill="url(#ma)"/>
  <text x="805" y="344" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">6.813</text>
  <rect x="250" y="353" width="616" height="14" rx="7" fill="url(#naive)"/>
  <text x="876" y="365" fill="#fda4af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">7.698</text>

  <!-- RMSE -->
  <text x="88" y="428" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">RMSE</text>
  <text x="88" y="448" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">penalises larger misses</text>
  <rect x="250" y="410" width="504" height="18" rx="9" fill="url(#primary)"/>
  <text x="764" y="424" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">8.406</text>
  <rect x="250" y="435" width="565" height="14" rx="7" fill="url(#ma)"/>
  <text x="825" y="447" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">9.415</text>
  <rect x="250" y="456" width="601" height="14" rx="7" fill="url(#naive)"/>
  <text x="861" y="468" fill="#fda4af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">10.018</text>

  <!-- WAPE -->
  <text x="88" y="531" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">WAPE</text>
  <text x="88" y="551" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">weighted absolute % error</text>
  <rect x="250" y="513" width="453" height="18" rx="9" fill="url(#primary)"/>
  <text x="713" y="527" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">11.32%</text>
  <rect x="250" y="538" width="488" height="14" rx="7" fill="url(#ma)"/>
  <text x="748" y="550" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">12.19%</text>
  <rect x="250" y="559" width="551" height="14" rx="7" fill="url(#naive)"/>
  <text x="811" y="571" fill="#fda4af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">13.77%</text>

  <rect x="82" y="590" width="1036" height="24" rx="12" fill="#052e2b"/>
  <text x="600" y="607" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">✓ The measured serving forecaster beats both transparent baselines on MAE, RMSE and WAPE</text>

  <text x="58" y="660" fill="#fbbf24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Benchmark boundary</text>
  <text x="190" y="660" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">The measured backtest uses the TimesFM-compatible seasonal serving forecaster; real TimesFM 2.5 is a separate registered CUDA layer and must retain its own backtest provenance.</text>
  <text x="58" y="688" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Source: GET /forecast/backtest?horizon=1&amp;n_origins=6&amp;per_head=false and GET /forecast/layers • captured 26 July 2026</text>
</svg>
