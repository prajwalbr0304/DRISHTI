<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">DRISHTI workload-band held-out model comparison</title>
  <desc id="desc">Accuracy and quadratic weighted kappa for prior-period, gradient boosting, current in-context serving model and majority baseline, plus the honest TabFM GPU evaluation status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".55" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="accuracy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="qwk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#475569" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="58" y="60" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Workload-band model comparison</text>
  <text x="58" y="92" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Held-out district-quarter evaluation • 128 test rows • 4 ordinal workload bands • synthetic data</text>

  <rect x="780" y="38" width="160" height="38" rx="19" fill="#cffafe"/>
  <circle cx="804" cy="57" r="7" fill="#0891b2"/>
  <text x="820" y="62" fill="#164e63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Accuracy</text>
  <rect x="952" y="38" width="160" height="38" rx="19" fill="#ede9fe"/>
  <circle cx="976" cy="57" r="7" fill="#7c3aed"/>
  <text x="992" y="62" fill="#4c1d95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">QWK</text>

  <rect x="46" y="122" width="1108" height="394" rx="24" fill="#fff" stroke="#dbeafe" filter="url(#shadow)"/>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="360" y1="165" x2="360" y2="482"/>
    <line x1="472" y1="165" x2="472" y2="482"/>
    <line x1="584" y1="165" x2="584" y2="482"/>
    <line x1="696" y1="165" x2="696" y2="482"/>
    <line x1="808" y1="165" x2="808" y2="482"/>
    <line x1="920" y1="165" x2="920" y2="482"/>
    <line x1="1032" y1="165" x2="1032" y2="482"/>
  </g>
  <g fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">
    <text x="356" y="153">0%</text>
    <text x="464" y="153">10%</text>
    <text x="576" y="153">20%</text>
    <text x="688" y="153">30%</text>
    <text x="800" y="153">40%</text>
    <text x="912" y="153">50%</text>
    <text x="1024" y="153">60%</text>
  </g>

  <!-- Prior -->
  <text x="82" y="204" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Prior-period baseline</text>
  <text x="82" y="226" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">transparent persistence baseline</text>
  <rect x="360" y="184" width="726" height="17" rx="8.5" fill="url(#accuracy)"/>
  <text x="1096" y="198" fill="#1d4ed8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">64.84%</text>
  <rect x="360" y="207" width="632" height="12" rx="6" fill="url(#qwk)"/>
  <text x="1002" y="218" fill="#6d28d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">56.39%</text>

  <!-- GBM -->
  <text x="82" y="280" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Histogram GBM</text>
  <text x="82" y="302" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">trained tabular baseline</text>
  <rect x="360" y="260" width="551" height="17" rx="8.5" fill="url(#accuracy)"/>
  <text x="921" y="274" fill="#1d4ed8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">49.22%</text>
  <rect x="360" y="283" width="436" height="12" rx="6" fill="url(#qwk)"/>
  <text x="806" y="294" fill="#6d28d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">38.91%</text>

  <!-- In context -->
  <text x="82" y="356" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Current in-context serving model</text>
  <text x="82" y="378" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">deterministic CPU fallback contract</text>
  <rect x="360" y="336" width="464" height="17" rx="8.5" fill="url(#accuracy)"/>
  <text x="834" y="350" fill="#1d4ed8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">41.41%</text>
  <rect x="360" y="359" width="372" height="12" rx="6" fill="url(#qwk)"/>
  <text x="742" y="370" fill="#6d28d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">33.17%</text>

  <!-- Majority -->
  <text x="82" y="432" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Majority-class baseline</text>
  <text x="82" y="454" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">minimum sanity comparator</text>
  <rect x="360" y="412" width="114" height="17" rx="8.5" fill="url(#accuracy)"/>
  <text x="484" y="426" fill="#1d4ed8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">10.16%</text>
  <rect x="360" y="435" width="2" height="12" rx="1" fill="url(#qwk)"/>
  <text x="372" y="446" fill="#6d28d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">0.00%</text>

  <!-- TabFM status -->
  <rect x="46" y="538" width="1108" height="104" rx="22" fill="#071b35" stroke="#22d3ee" stroke-opacity=".55" filter="url(#shadow)"/>
  <rect x="72" y="559" width="112" height="60" rx="16" fill="#083344"/>
  <text x="128" y="587" text-anchor="middle" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">TabFM</text>
  <text x="128" y="605" text-anchor="middle" fill="#a5f3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600">GPU CANDIDATE</text>
  <text x="210" y="571" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Used as DRISHTI's governed foundation-model path for aggregate workload bands</text>
  <text x="210" y="596" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Real Google TabFM weights are dispatched to the protected CUDA endpoint and fail closed if CUDA, weights or digest verification is missing.</text>
  <text x="210" y="618" fill="#fbbf24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">No TabFM accuracy bar is shown because the recorded CPU benchmark deferred the real 3.3 GB weights; a GPU score must be captured before promotion.</text>
</svg>
